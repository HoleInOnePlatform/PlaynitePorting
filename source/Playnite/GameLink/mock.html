<!doctype html>
<meta charset="utf-8">
<title>GameLink mock session</title>
<p>GameLink mock session</p>
<button id="point">Point reached</button>
<button id="ready">Ready</button>
<button id="failed">Failed</button>
<script>
const params = new URLSearchParams(location.search);
const sessionId = params.get('sessionId');
const gameId = params.get('gameId');
let sequence = 0;
function send(type) {
  CefSharp.PostMessage(JSON.stringify({
    version: 1, type, eventId: crypto.randomUUID(), sessionId, gameId,
    sequence: ++sequence, occurredAtUtc: new Date().toISOString(),
    payload: {handoffId: crypto.randomUUID(), artifactId: 'mock-artifact'}
  }));
}
for (const type of ['point', 'ready', 'failed']) {
  document.getElementById(type).onclick = () => send('handoff.' + (type === 'point' ? 'point.reached' : type));
}
</script>
